    <meta name="theme-color" content="#10263D" media="(prefers-color-scheme: dark)" />

    <!--
      Blocking pre-hydration theme check: reads the same 'portfolio_theme' key
      ThemeContext (src/context/ThemeContext.jsx) writes to, so the correct
      class is on <html> before first paint — avoids a flash of the wrong
      theme while React boots.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) {}
      })();
    </script>
